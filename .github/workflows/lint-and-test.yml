# Runs reckon-gater's checks on the pinned OTP 28, so a change that breaks the
# gateway shows here before a service rebuild pulls it in. Nothing here
# publishes; releases go through publish-hex.yml.
#
# ADOPTED from the unmerged branch `ci/github-test-runs' (636e72f, d48d425),
# whose content and reasoning this is. That branch was never merged and ran
# twice on 2026-09-11, failing both times on xref (a false positive, fixed in
# rebar.config's xref_ignores in this same change) and on dialyzer (58
# findings, see below). Its two non-obvious decisions are kept deliberately and
# are its own, not invented here:
#
#   1. NEVER CACHE `_build', only the hex package cache and dialyzer's PLTs.
#      `rebar.lock' is not tracked in this repository, so a cached `_build'
#      can serve stale dependencies or beams and hide a real failure.
#   2. rebar3 BY DIRECT DOWNLOAD, checked against the sha256 GitHub publishes
#      for that release asset, because setup-beam's own rebar3 lookup has
#      failed on the GitHub releases pagination cap. Intermittent rather than
#      universal: evoq uses setup-beam's rebar3 and works.
#
# ⚠ `branches: ['**']' IS LOAD-BEARING, and is the one change to the branch's
# triggers. A `push' event fires for TAG refs as well as branch refs, so the
# branch's bare `on: push:' would run this suite a second time on every release
# tag, beside publish-hex.yml. `**' matches every branch and excludes tags.
# Same defect, same fix, in reckon-db-org/evoq (c589fcc) and macula-io/macula
# (7edc84d2); this is its third instance, and it is only visible once a repo
# has a real tag to distinguish the two triggers.
#
# ⚠ DIALYZER RUNS AS A RATCHET, NOT A PASS/FAIL GATE. This repository arrived
# with 58 findings, measured on OTP 28.4.2 at ef4e4e7 before this workflow
# existed. Failing the job on all of them would make main red on every push,
# which gives no green signal at all and teaches everyone to ignore the result;
# suppressing them would lose the debt. So the 58 are recorded in
# `.dialyzer_baseline' and `scripts/check_ratchet.sh' fails only on a
# finding that is NOT in that file, and reports one that has been fixed so its
# line can be struck. The debt stays counted and visible, main can be green,
# and nobody can add to it quietly. Do NOT add continue-on-error, and do not
# regenerate the baseline to make a new finding go away: --update is for
# recording a finding somebody decided to accept, in a commit that says why.
name: lint-and-test

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'assets/**'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'assets/**'
      - 'doc/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # From .tool-versions, which is what a developer's shell resolves here.
  OTP_VERSION: '28.4.2'
  REBAR3_VERSION: '3.27.0'
  REBAR3_SHA256: 'af85aab41f9fd74bdd6341ebdf6fe9c88077aab9f8eac82371583fa02f2b0bdf'

# A newer push to the same branch supersedes a running check, except on main,
# where every commit keeps its own result.
concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: compile + xref + lint + eunit + ct + proper + dialyzer (OTP 28.4.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          curl -fsSL -o rebar3 "https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3"
          echo "${REBAR3_SHA256}  rebar3" | sha256sum --check --strict -
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3
          rebar3 version

      - name: Cache hex packages and PLTs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build/default/*_plt
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('rebar.config') }}

      - name: Compile
        id: compile
        run: rebar3 compile

      # Once the code compiles, every check runs even when an earlier one
      # failed, so one run reports all failures. The job still fails if any
      # check fails.
      - name: Xref
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 xref

      - name: Lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 lint

      - name: EUnit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 eunit

      - name: Common Test
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 ct

      # The branch's list did not include proper, though rebar3_proper is a
      # project plugin here and the suite passes. Added so the plugin is not
      # carried unrun.
      - name: PropEr
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 proper

      - name: Dialyzer (ratchet against .dialyzer_baseline)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: bash scripts/check_ratchet.sh
